<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>SEEN Explore - iPhone 17 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #000;
      --mythic-gradient: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4, #7c3aed);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      height: 100dvh;
      overflow: hidden;
    }
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    /* iPhone 17 Pro Hardware Elements */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 3000;
    }
    .content {
      flex: 1;
      padding: 1rem;
      padding-top: 60px;
      overflow-y: auto;
      padding-bottom: 110px;
    }
    .content::-webkit-scrollbar { display: none; }
    /* SEEN Logo Header */
    .logo-text {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 4px;
      background: linear-gradient(to right, #fff, #a78bfa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: block;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      padding: 0.7rem 1rem;
      border-radius: 15px;
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      background: #1a1a1a;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #a78bfa;
      border: 1px solid #333;
      white-space: nowrap;
    }
    /* MYTHIC GRID CARDS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .card-item {
      position: relative;
      padding: 1.5px; /* Rainbow Border thickness */
      border-radius: 20px;
      background: var(--mythic-gradient);
      background-size: 200% 200%;
      animation: gradientMove 4s ease infinite;
      overflow: hidden;
      aspect-ratio: 3/4;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 19px;
      overflow: hidden;
    }
    .card-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Cinematic Fade Overlay */
    .card-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #000 15%, transparent 60%);
    }
    .card-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
    }
    .card-info h2 {
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 2px;
    }
    .card-info .stats {
      font-size: 10px;
      color: #a78bfa;
      font-weight: 700;
    }
    /* iPhone Navigation Bar */
    .nav-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .button-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex: 1;
    }
    .home-indicator {
      width: 134px;
      height: 5px;
      background: #fff;
      border-radius: 100px;
      margin: 8px auto;
      opacity: 0.3;
    }
    .button .icon { width: 24px; height: 24px; color: #fff; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="dynamic-island"></div>

  <section class="content">
    <span class="logo-text">Seen</span>
    <div class="search-bar">
      <svg class="w-4 h-4 text-gray-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="3"></path></svg>
      <input type="text" placeholder="Search profiles..." class="bg-transparent outline-none text-sm w-full">
    </div>
    <div class="tags">
      <span class="tag">PETITE</span>
      <span class="tag">BRUNETTE</span>
      <span class="tag">GEEK</span>
      <span class="tag">TRAVELER</span>
    </div>
    <div class="cards-grid">
      <div class="card-item">
        <div class="card-inner">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400" alt="">
          <div class="card-fade"></div>
          <div class="card-info">
            <h2>Liz, 25</h2>
            <div class="stats">★ 4.9 (16 reviews)</div>
          </div>
        </div>
      </div>
      <div class="card-item">
        <div class="card-inner">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400" alt="">
          <div class="card-fade"></div>
          <div class="card-info">
            <h2>Sophie, 26</h2>
            <div class="stats">★ 4.7 (12 reviews)</div>
          </div>
        </div>
      </div>
      <div class="card-item">
        <div class="card-inner">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400" alt="">
          <div class="card-fade"></div>
          <div class="card-info">
            <h2>Emma, 24</h2>
            <div class="stats">★ 4.8 (10 reviews)</div>
          </div>
        </div>
      </div>
      <div class="card-item">
        <div class="card-inner">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="">
          <div class="card-fade"></div>
          <div class="card-info">
            <h2>Ava, 24</h2>
            <div class="stats">★ 4.6 (8 reviews)</div>
          </div>
        </div>
      </div>
      <div class="card-item">
        <div class="card-inner">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400" alt="">
          <div class="card-fade"></div>
          <div class="card-info">
            <h2>Jordan, 27</h2>
            <div class="stats">★ 4.9 (21 reviews)</div>
          </div>
        </div>
      </div>
      <div class="card-item">
        <div class="card-inner">
          <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=400" alt="">
          <div class="card-fade"></div>
          <div class="card-info">
            <h2>Mia, 23</h2>
            <div class="stats">★ 4.8 (9 reviews)</div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <nav class="nav-bar">
    <div class="button-row">
      <!-- Home -->
      <button class="button" onclick="window.location.href='discover.html'">
        <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor">
          <path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204zm217.9-325.7V868H632V640c0-22.1-17.9-40-40-40H432c-22.1 0-40 17.9-40 40v228H238.1V542.3h-96l370-369.7 23.1 23.1L882 542.3h-96.1z"></path>
        </svg>
      </button>

      <!-- Search (current page) -->
      <button class="button" style="color: #a78bfa;">
        <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>

      <!-- Profile -->
      <button class="button" onclick="window.location.href='profile.html'">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0Z"></path>
        </svg>
      </button>

      <!-- Store - now links to store.html -->
      <button class="button" onclick="window.location.href='store.html'">
        <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
        </svg>
      </button>
    </div>
    <div class="home-indicator"></div>
  </nav>
</div>
</body>
</html>
