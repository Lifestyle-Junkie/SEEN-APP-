<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swipe App</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #000;
      --bg-frame-overlay: linear-gradient(to bottom, #000 16%, #1a1a1a 80%);
      --bg-article-overlay: linear-gradient(to bottom, transparent 73%, #00000055 90%);
      --clr-white: #fff;
      --clr-black: #000101;
      --clr-red: #ff5168;
      --clr-notification: #f3c87b;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      overflow-x: hidden;
    }

    @layer reset, base, frame, header, nav, content, footer, utilities;

    @layer reset {
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    }

    @layer base {
      * {
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: var(--bg);
        display: grid;
        place-content: center;
        min-height: 100dvh;
        overflow: hidden;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }

    @layer frame {
      .frame {
        width: 100%;
        min-height: 100vh;
        position: relative;
        display: flex;
      }
      .container {
        position: relative;
        width: 100%;
        display: grid;
        grid-template-rows: auto auto 1fr 64px;
        grid-template-areas: "header" "nav" "cards" "footer";
        padding: 0 clamp(8px, 2vw, 16px);
        margin: 0;
        overflow: hidden;
      }
    }

    @layer header {
      header {
        grid-area: header;
        display: flex;
        align-items: center;
        justify-content: space-around;
        color: var(--clr-white);
        margin: 30px 0 8px;
        gap: 136px;
        span {
          font-size: 11px;
          font-weight: 600;
          line-height: 1.5;
        }
        .header__icons {
          display: flex;
          align-items: center;
        }
      }
    }

    @layer nav {
      nav {
        grid-area: nav;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 20px;
        position: relative;
      }
      .nav__icons {
        display: flex;
        align-items: center;
        gap: 1rem;
        position: relative;
        &::before {
          content: "";
          position: absolute;
          right: 16px;
          top: 6px;
          background-color: var(--clr-red);
          width: 8px;
          height: 8px;
          border-radius: 50%;
        }
      }
      .seen-text {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        font-weight: bold;
        color: var(--clr-white);
        font-size: 50px;
        text-align: center;
      }
    }

    @layer content {
      .cards {
        grid-area: cards;
        position: relative;
        width: clamp(280px, 85vw, 500px);
        height: 100%;
        max-height: 470px;
        margin: 0 auto;
        overflow: hidden;
        p {
          height: 100%;
          text-align: center;
          font-size: 12px;
          color: var(--clr-white);
        }
      }
      article {
        position: absolute;
        inset: 0;
        cursor: grab;
        user-select: none;
        border-radius: 16px;
        overflow: hidden;
        will-change: transform;
        height: 100%;
        &.gone-left, &.gone-right, &.reset-state {
          transition: transform 0.2s ease;
        }
        &.gone-left {
          transform: translateX(-200%) rotate(-35deg) !important;
        }
        &.gone-right {
          transform: translateX(200%) rotate(35deg) !important;
        }
        &.reset-state {
          transform: translateX(0) !important;
        }
        &:active {
          cursor: grabbing;
        }
      }
      .article__content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--bg-article-overlay);
        color: var(--clr-white);
        padding: 8px;
        h2 {
          margin-bottom: 6px;
          font-size: 24px;
        }
        span {
          font-size: 14px;
          color: #ccc;
        }
        .bio {
          font-size: 14px;
          color: #eee;
          margin-top: 10px;
          line-height: 1.5;
        }
        .review-details {
          font-size: 14px;
          color: #eee;
          margin-top: 6px;
        }
        .review-details a {
          color: #fff;
          text-decoration: underline;
          cursor: pointer;
        }
        .review-circle {
          display: none;
          position: absolute;
          top: 150px;
          left: 15px;
          width: 70px;
          height: 70px;
          background: #fff;
          border-radius: 50%;
          overflow: hidden;
          border: 2px solid #ccc;
        }
        .review-circle img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .review-label {
          display: none;
          position: absolute;
          top: 230px;
          left: 15px;
          color: #fff;
          font-size: 10px;
          background: #000;
          padding: 4px 8px;
          border-radius: 15px;
          white-space: nowrap;
        }
        .reviews-avatars {
          display: none;
          margin-top: 8px;
          max-height: 120px;
          overflow-y: auto;
          padding: 8px;
          background: transparent;
          border-radius: 8px;
          scrollbar-width: none;
          -ms-overflow-style: none;
        }
        .reviews-avatars::-webkit-scrollbar {
          display: none;
        }
      }
      .choice-btn {
        position: absolute;
        top: 32px;
        right: 16px;
        background-color: transparent;
        color: var(--clr-black);
        border-radius: 8px;
        border: 4px solid;
        opacity: 0;
        padding: 4px 8px;
        font-size: 24px;
        font-weight: 700;
        width: fit-content;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        &.nope {
          border-color: #ff6e63;
          color: #ff6e63;
          rotate: 30deg;
        }
        &.like {
          border-color: #63ff68;
          color: #63ff68;
          left: 16px;
          rotate: -30deg;
        }
      }
    }

    @layer footer {
      .nav-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100vw;
        height: 64px;
        background: var(--bg);
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid #333;
        border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px;
        z-index: 10;
      }
      .button-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        justify-items: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 0 8px;
      }
      .button {
        background: none;
        border: none;
        color: var(--clr-white);
        font-size: 24px;
        cursor: pointer;
        transition: color 0.2s;
        width: 100%;
        max-width: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        transform: none;
        will-change: none;
        touch-action: manipulation;
      }
      .button:hover {
        color: #ccc;
        transform: none;
      }
      .button:active {
        transform: none;
      }
      .button .icon {
        width: 26px;
        height: 26px;
        vertical-align: middle;
      }
    }

    @layer utilities {
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>
</head>

  <script>
    /* [Entire script unchanged] */
    /***************** User Info *****************/
    const cards = document.querySelector(".cards");

    const data = [
      {
        username: "Jefferson",
        role: "Journalist",
        interest: "1",
        distance: "4",
        imgSrc: "https://images.unsplash.com/photo-1548544149-4835e62ee5b3?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjM2fHxwZXJzb258ZW58MHx8MHx8fDI%3D",
        bio: "Loves writing stories, coffee shops, and late-night debates. Always up for a good book recommendation."
      },
      {
        username: "Emily",
        role: "Engineer",
        interest: "4",
        distance: "1",
        imgSrc: "https://images.unsplash.com/photo-1597586124394-fbd6ef244026?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTM2fHxwZXJzb258ZW58MHx8MHx8fDI%3D",
        bio: "Tech enthusiast who enjoys hiking and building cool gadgets. Looking for someone to share adventures with."
      },
      {
        username: "Doruk",
        role: "Musician",
        interest: "2",
        distance: "4",
        imgSrc: "https://images.unsplash.com/photo-1579980645199-c2acb89ec42b?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjV8fHBlcnNvbiUyMG11c2ljaWFufGVufDB8fDB8fHwy",
        bio: "Guitarist with a passion for live music and cozy jam sessions. Let's create a playlist together!"
      }
    ];

    function populateInfo() {
      data.forEach((person, index) => {
        const { username, role, imgSrc, bio } = person;
        cards.innerHTML += `
          <article>
            <img src=${imgSrc} alt="person-${username}" />
            <div class="article__content">
              <h2>${username}, 25</h2>
              <span>${role}</span>
              <div class="review-details">
                <strong>4.9</strong> ★ · <a href="#" onclick="toggleVideo(${index})">Watch 1 video</a> · <a href="#" onclick="toggleReviews(${index})">16 reviews</a>
              </div>
              <div class="bio">${bio}</div>
              <div class="review-circle" id="reviewCircle-${index}">
                <img src="https://picsum.photos/80/80?random=${index + 4}" alt="Reviewer">
              </div>
              <div class="review-label" id="reviewLabel-${index}">Watch Video</div>
              <div id="reviews-avatars-${index}" class="reviews-avatars">
                <h3 style="color: #fff; font-size: 14px; margin-bottom: 8px;">Reviews (16)</h3>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <img src="https://picsum.photos/40/40?random=${index + 2}" alt="Reviewer 1" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ccc;">
                    <div>
                      <strong style="color: #fff; font-size: 12px;">Alex</strong> <span style="color: #ccc; font-size: 10px;">· 5★</span>
                      <p style="color: #eee; font-size: 10px; margin: 0;">Great conversation starter! Loved the ${role.toLowerCase()} vibes.</p>
                    </div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <img src="https://picsum.photos/40/40?random=${index + 3}" alt="Reviewer 2" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ccc;">
                    <div>
                      <strong style="color: #fff; font-size: 12px;">Jordan</strong> <span style="color: #ccc; font-size: 10px;">· 4.5★</span>
                      <p style="color: #eee; font-size: 10px; margin: 0;">Fun and genuine—highly recommend!</p>
                    </div>
                  </div>
                </div>
                <a href="#" style="color: #fff; font-size: 10px; text-decoration: underline; display: block; margin-top: 8px;">See all reviews</a>
              </div>
            </div>
            <button class="choice-btn nope" aria-label="reject option">NOPE</button>
            <button class="choice-btn like" aria-label="accept option">LIKE</button>
          </article>
        `;
      });
    }

    populateInfo();

    /***************** Swipe Effect *****************/
    const DECISION_THRESHOLD = 80;
    let startX;
    let card;
    let isAnimating = false;
    let tracedDistance = 0;

    function startDrag(e) {
      if (isAnimating) return;
      card = e.target.closest("article");
      if (!card) return;
      startX = e.pageX ?? e.touches[0].pageX;
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onMoveEnd);
      document.addEventListener("touchmove", onMove);
      document.addEventListener("touchend", onMoveEnd);
    }

    function onMove(e) {
      isAnimating = true;
      const currentX = e.pageX ?? e.touches[0].pageX;
      tracedDistance = currentX - startX;
      const rotation = 10;
      const rotationDeg = tracedDistance / rotation;
      card.style.transform = `translateX(${tracedDistance}px) rotate(${rotationDeg}deg)`;
      const tOpacity = 72;
      const opacityAmount = Math.abs(tracedDistance) / tOpacity;
      const isRight = tracedDistance >= 0;
      const opacityEl = isRight ? card.querySelector(".choice-btn.like") : card.querySelector(".choice-btn.nope");
      opacityEl.style.opacity = opacityAmount;
    }

    function onMoveEnd(e) {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onMoveEnd);
      document.removeEventListener("touchmove", onMove);
      document.removeEventListener("touchend", onMoveEnd);
      const decisionMade = Math.abs(tracedDistance) >= DECISION_THRESHOLD;
      if (decisionMade) {
        const isLiked = tracedDistance >= 0;
        card.classList.add(isLiked ? "gone-right" : "gone-left");
        card.addEventListener("transitionend", () => {
          card.remove();
        });
      } else {
        card.classList.add("reset-state");
        card.querySelectorAll(".choice-btn").forEach((el) => (el.style.opacity = 0));
      }
      card.addEventListener("transitionend", () => {
        card.removeAttribute("style");
        card.classList.remove("reset-state");
        tracedDistance = 0;
        isAnimating = false;
      });
      card.querySelectorAll(".choice-btn").forEach((el) => (el.style.opacity = 0));
    }

    document.addEventListener("mousedown", startDrag);
    document.addEventListener("touchstart", startDrag, { passive: true });

    /***************** Show tmr *****************/
    const tmrEl = document.querySelector("header span");

    function showTm() {
      const now = new Date();
      const mins = now.getMinutes().toString();
      const hours = now.getHours().toString();
      const formattedMins = mins.padStart(2, "0");
      tmrEl.innerText = `${hours}:${formattedMins}`;
    }

    function showCurrentTm() {
      showTm();
      const now = new Date();
      const nextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
      setTimeout(() => {
        showTm();
        setInterval(showTm, 60000);
      }, nextMinute);
    }

    showCurrentTm();

    /***************** Toggle Video and Reviews *****************/
    function toggleVideo(index) {
      const reviewCircle = document.getElementById(`reviewCircle-${index}`);
      const reviewLabel = document.getElementById(`reviewLabel-${index}`);
      const bio = document.querySelectorAll('.bio')[index];
      const reviewsAvatars = document.getElementById(`reviews-avatars-${index}`);
      const isVisible = reviewCircle.style.display === 'block';
      reviewCircle.style.display = isVisible ? 'none' : 'block';
      reviewLabel.style.display = isVisible ? 'none' : 'block';
      bio.style.display = isVisible ? 'block' : 'none';
      reviewsAvatars.style.display = 'none';
    }

    function toggleReviews(index) {
      const reviewsAvatars = document.getElementById(`reviews-avatars-${index}`);
      const bio = document.querySelectorAll('.bio')[index];
      const reviewCircle = document.getElementById(`reviewCircle-${index}`);
      const reviewLabel = document.getElementById(`reviewLabel-${index}`);
      const isReviewsVisible = reviewsAvatars.style.display === 'block';
      reviewsAvatars.style.display = isReviewsVisible ? 'none' : 'block';
      bio.style.display = isReviewsVisible ? 'block' : 'none';
      reviewCircle.style.display = 'none';
      reviewLabel.style.display = 'none';
    }
  </script>
