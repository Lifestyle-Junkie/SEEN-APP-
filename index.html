<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Seen Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .carousel-container {
      position: relative;
      width: 90%;
      max-width: 350px;
      height: 690px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0 10px;
    }

    .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 640px;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease, filter 0.5s ease, opacity 0.5s ease;
      padding: 2px;
      z-index: 5;
    }

    .slide.active {
      transform: scale(1.2) translateX(0);
      filter: none;
      opacity: 1;
      z-index: 15;
    }

    .slide.left {
      transform: scale(0.9) translateX(-180px);
      filter: grayscale(80%) blur(2px);
      opacity: 0.8;
      z-index: 10;
    }

    .slide.right {
      transform: scale(0.9) translateX(180px);
      filter: grayscale(80%) blur(2px);
      opacity: 0.8;
      z-index: 10;
    }

    .slide.far {
      transform: scale(0.7) translateX(-240px);
      filter: grayscale(100%) blur(4px);
      opacity: 0.6;
      z-index: 5;
    }

    .slide.far.right {
      transform: scale(0.7) translateX(240px);
    }

    .logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.2rem;
      font-weight: 700;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      color: #f8eadd;
      text-transform: uppercase;
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    .tagline {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: #ccc;
      font-size: 0.8rem;
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    .login-form {
      width: 90%;
      max-width: 350px;
      margin-top: 20px; /* Added to lower the form */
    }

    .form-control {
      position: relative;
      margin: 10px 0 20px;
      width: 100%;
    }

    .form-control input {
      background-color: transparent;
      border: 0;
      border-bottom: 2px #fff solid;
      display: block;
      width: 100%;
      padding: 8px 0;
      font-size: 14px;
      color: #fff;
    }

    .form-control input:focus,
    .form-control input:valid {
      outline: 0;
      border-bottom-color: #f14e75;
    }

    .form-control label {
      position: absolute;
      top: 8px;
      left: 0;
      pointer-events: none;
    }

    .form-control label span {
      display: inline-block;
      font-size: 14px;
      min-width: 5px;
      color: #fff;
      transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .form-control input:focus + label span,
    .form-control input:valid + label span {
      color: #f14e75;
      transform: translateY(-20px);
    }

    .login-form .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      border: none;
      width: 7em;
      height: 2.5em;
      border-radius: 3em;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: #1C1A1C;
      cursor: pointer;
      transition: all 450ms ease-in-out;
    }

    .sparkle {
      fill: #AAAAAA;
      transition: all 800ms ease;
    }

    .text {
      font-weight: 600;
      color: #AAAAAA;
      font-size: x-small;
    }

    .btn:hover {
      background: linear-gradient(0deg, #f14e75, #d43a5e);
      box-shadow: inset 0px 1px 0px 0px rgba(255, 255, 255, 0.4),
                  inset 0px -4px 0px 0px rgba(0, 0, 0, 0.2),
                  0px 0px 0px 4px rgba(255, 255, 255, 0.2),
                  0px 0px 180px 0px #f14e75;
      transform: translateY(-2px);
    }

    .btn:hover .text {
      color: white;
    }

    .btn:hover .sparkle {
      fill: white;
      transform: scale(1.2);
    }

    .forgot {
      font-size: 0.7rem;
      color: #888;
      text-align: right;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      .carousel-container {
        height: 530px;
      }

      .slide {
        height: 480px;
        padding: 2px;
      }

      .slide.active {
        transform: scale(1.1) translateX(0);
      }

      .slide.left {
        transform: scale(0.8) translateX(-130px);
      }

      .slide.right {
        transform: scale(0.8) translateX(130px);
      }

      .slide.far {
        transform: scale(0.6) translateX(-160px);
      }

      .slide.far.right {
        transform: scale(0.6) translateX(160px);
      }

      .logo {
        font-size: 2.2rem;
      }

      .tagline {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="carousel-container">
    <div class="carousel">
      <!-- Slides will be injected here -->
    </div>
  </div>

  <form class="login-form">
    <div class="form-control">
      <input required type="text">
      <label>
        <span style="transition-delay:350ms">U</span>
        <span style="transition-delay:300ms">s</span>
        <span style="transition-delay:250ms">e</span>
        <span style="transition-delay:200ms">r</span>
        <span style="transition-delay:150ms">n</span>
        <span style="transition-delay:100ms">a</span>
        <span style="transition-delay:50ms">m</span>
        <span style="transition-delay:0ms">e</span>
      </label>
    </div>
    <div class="form-control">
      <input required type="password">
      <label>
        <span style="transition-delay:350ms">P</span>
        <span style="transition-delay:300ms">a</span>
        <span style="transition-delay:250ms">s</span>
        <span style="transition-delay:200ms">s</span>
        <span style="transition-delay:150ms">w</span>
        <span style="transition-delay:100ms">o</span>
        <span style="transition-delay:50ms">r</span>
        <span style="transition-delay:0ms">d</span>
      </label>
    </div>
    <div class="forgot">Forgot password?</div>
    <div class="actions">
      <button type="submit" class="btn">
        <svg height="16" width="16" fill="#FFFFFF" viewBox="0 0 24 24" class="sparkle">
          <path d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245Z"/>
        </svg>
        <span class="text">LOGIN</span>
      </button>
      <button type="button" class="btn">
        <svg height="16" width="16" fill="#FFFFFF" viewBox="0 0 24 24" class="sparkle">
          <path d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245Z"/>
        </svg>
        <span class="text">REGISTER</span>
      </button>
    </div>
  </form>

  <script>
    const slidesData = [
      { image: 'gamergirl.png', label: 'Gamer Girl', logo: 'seen', tagline: 'Find gothically inclined people near you.' },
      { image: 'Girlwithhat.png', label: 'Girl with Hat', logo: 'seen', tagline: 'Discover real energy. Real people.' },
      { image: 'Lightskin.png', label: 'Lightskin', logo: 'seen', tagline: 'She’s waiting. Will you swipe?' }
    ];

    const carousel = document.querySelector('.carousel');
    let currentIndex = 0;

    function createSlides() {
      carousel.innerHTML = '';
      slidesData.forEach((slide, index) => {
        const slideElement = document.createElement('div');
        slideElement.classList.add('slide');
        slideElement.style.backgroundImage = `url(${slide.image})`;
        slideElement.dataset.index = index;

        const logoElement = document.createElement('div');
        logoElement.classList.add('logo');
        logoElement.textContent = slide.logo.toUpperCase();

        const taglineElement = document.createElement('div');
        taglineElement.classList.add('tagline');
        taglineElement.textContent = slide.tagline;

        slideElement.appendChild(logoElement);
        slideElement.appendChild(taglineElement);
        carousel.appendChild(slideElement);
      });
      updateCarousel();
    }

    function updateCarousel() {
      const slides = document.querySelectorAll('.slide');
      slides.forEach((slide, index) => {
        const offset = ((index - currentIndex + slidesData.length) % slidesData.length);
        slide.className = 'slide';
        if (offset === 0) {
          slide.classList.add('active');
        } else if (offset === 1 || offset === slidesData.length - 1) {
          slide.classList.add(offset === 1 ? 'right' : 'left');
        } else {
          slide.classList.add('far');
          slide.classList.add(offset < slidesData.length / 2 ? 'left' : 'right');
        }
      });
    }

    function moveCarousel(direction) {
      currentIndex = (currentIndex + direction + slidesData.length) % slidesData.length;
      updateCarousel();
    }

    setInterval(() => {
      moveCarousel(1);
    }, 4000);

    createSlides();
  </script>
</body>
</html>
