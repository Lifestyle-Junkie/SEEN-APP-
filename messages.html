<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>SEEN Chat OS - iPhone 17 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #000;
      --clr-purple: #7c3aed;
      --clr-pink: #ec4899;
      --clr-cyan: #06b6d4;
      --mythic-gradient: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4, #7c3aed);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 3000;
    }

    .logo-text {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 4px;
      background: linear-gradient(to right, #fff, #a78bfa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .content {
      flex: 1;
      padding: 1.5rem;
      padding-top: 70px;
      overflow-y: auto;
      background: #000;
      padding-bottom: 110px;
    }

    .content::-webkit-scrollbar { display: none; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.08);
      padding: 0.8rem 1.2rem;
      border-radius: 18px;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .filter-btn {
      color: #a78bfa;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* RAINBOW BORDER CHAT TILES */
    .chat-tile {
      position: relative;
      padding: 1.5px;
      border-radius: 24px;
      margin-bottom: 1rem;
      background: var(--mythic-gradient);
      background-size: 200% 200%;
      animation: gradientMove 4s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .chat-tile-inner {
      border-radius: 23px;
      background: #000;
      padding: 1.1rem;
      display: flex;
      align-items: center;
    }

    .chat-tile.read .chat-preview { color: #555; }
    .chat-tile.read .chat-name { color: #ccc; }

    .avatar-wrapper {
      position: relative;
      margin-right: 1.1rem;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #000;
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      background: #63ff68;
      border: 3px solid #000;
      border-radius: 50%;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 2px;
      color: #fff;
    }

    .chat-preview {
      font-size: 0.9rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timestamp {
      font-size: 0.75rem;
      color: #666;
      font-weight: 600;
      margin-left: 8px;
    }

    .nav-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .button-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      flex: 1;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background: #fff;
      border-radius: 100px;
      margin: 8px auto;
      opacity: 0.3;
    }

    /* Navigation button/link styling */
    .nav-btn {
      background: none;
      border: none;
      padding: 0;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, color 0.2s;
      text-decoration: none;
      color: #fff;
    }

    .nav-btn:hover {
      color: #a78bfa;
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .nav-btn.active {
      color: #a78bfa;
    }

    .nav-btn .icon {
      width: 26px;
      height: 26px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="dynamic-island"></div>

    <div class="content">
      <div class="header-row">
        <span class="logo-text">Seen</span>
        <div class="flex gap-5">
          <span class="filter-btn">Edit</span>
          <span class="filter-btn">Requests</span>
        </div>
      </div>

      <div class="search-bar">
        <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="Search" />
      </div>

      <div class="chat-tile">
        <div class="chat-tile-inner">
          <div class="avatar-wrapper">
            <img class="avatar" src="https://i.pravatar.cc/150?u=ella" alt="Ella">
            <div class="online-indicator"></div>
          </div>
          <div class="chat-info">
            <div class="chat-name">Ella</div>
            <div class="chat-preview font-medium">Rethinking the gym today...</div>
          </div>
          <div class="timestamp">7:04 PM</div>
        </div>
      </div>

      <div class="chat-tile read">
        <div class="chat-tile-inner">
          <div class="avatar-wrapper">
            <img class="avatar" src="https://i.pravatar.cc/150?u=mia" alt="Mia">
          </div>
          <div class="chat-info">
            <div class="chat-name">Mia</div>
            <div class="chat-preview">Message Send Failure</div>
          </div>
          <div class="timestamp">5:31 PM</div>
        </div>
      </div>

      <div class="chat-tile read">
        <div class="chat-tile-inner">
          <div class="avatar-wrapper">
            <img class="avatar" src="https://i.pravatar.cc/150?u=sophia" alt="Sophia">
          </div>
          <div class="chat-info">
            <div class="chat-name">Sophia</div>
            <div class="chat-preview">Loved that coffee spot!</div>
          </div>
          <div class="timestamp">3:15 PM</div>
        </div>
      </div>

      <div class="chat-tile">
        <div class="chat-tile-inner">
          <div class="avatar-wrapper">
            <img class="avatar" src="https://i.pravatar.cc/150?u=ava" alt="Ava">
            <div class="online-indicator"></div>
          </div>
          <div class="chat-info">
            <div class="chat-name">Ava</div>
            <div class="chat-preview font-medium">At work talk 2 u later</div>
          </div>
          <div class="timestamp">3:01 PM</div>
        </div>
      </div>
    </div>

    <!-- Updated Navigation with links -->
    <nav class="nav-bar">
      <div class="button-row">
        <a href="discover.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor">
            <path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204zm217.9-325.7V868H632V640c0-22.1-17.9-40-40-40H432c-22.1 0-40 17.9-40 40v228H238.1V542.3h-96l370-369.7 23.1 23.1L882 542.3h-96.1z"></path>
          </svg>
        </a>

        <a href="Explore.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </a>

        <a href="profile.html" class="nav-btn active">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0Z"></path>
          </svg>
        </a>

        <a href="store.html" class="nav-btn">
          <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
          </svg>
        </a>
      </div>
      <div class="home-indicator"></div>
    </nav>
  </div>

  <script>
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.chat-tile').forEach(tile => {
        const name = tile.querySelector('.chat-name').textContent.toLowerCase();
        tile.style.display = name.includes(term) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
