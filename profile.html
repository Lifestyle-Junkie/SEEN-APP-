<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>SEEN Profile - iPhone 17 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #000;
      --mythic-gradient: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4, #7c3aed);
      --clr-purple: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Poppins", sans-serif; }
    body {
      background-color: #000;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior-x: none;
    }
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 3000;
    }
    .content {
      flex: 1;
      padding: 1.5rem;
      padding-top: 70px;
      overflow-y: auto;
      padding-bottom: 120px;
    }
    .content::-webkit-scrollbar { display: none; }
    /* Profile Header Mythic Card */
    .mythic-profile-card {
      position: relative;
      padding: 1.5px;
      border-radius: 28px;
      background: var(--mythic-gradient);
      background-size: 200% 200%;
      animation: gradientMove 4s ease infinite;
      margin-bottom: 2rem;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .profile-card-inner {
      background: #0a0a0a;
      border-radius: 27px;
      padding: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .profile-main { display: flex; align-items: center; gap: 1rem; }
    .profile-main img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #111; object-fit: cover; }
    /* Sections */
    .section-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      transition: all 0.3s ease;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--clr-purple);
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bio-text { font-size: 0.85rem; color: #eee; outline: none; min-height: 20px; }
    /* Hashtag System */
    .tag-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .tag {
      background: rgba(167, 139, 250, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.2);
      color: var(--clr-purple);
      padding: 5px 14px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-input-wrapper {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 14px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .tag-input-wrapper input { background: transparent; border: none; outline: none; color: #fff; font-size: 0.85rem; flex: 1; }
    /* Photo Slots */
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .photo-slot {
      aspect-ratio: 1/1; background: #111; border-radius: 15px; border: 1.5px dashed #333;
      display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
    }
    /* Save Button */
    .save-btn {
      background: var(--mythic-gradient);
      background-size: 200%;
      color: white;
      font-weight: 900;
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
    }
    /* Preview Modal Overlay */
    #previewModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 5000;
      display: none; /* Hidden by default */
      place-items: center;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .animate-mythic { animation: spin 6s linear infinite; }
    /* Glow Pass Card */
    .glow-pass-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(236, 72, 153, 0.2));
      border: 1px solid #7c3aed;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
      border-radius: 22px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
    }
    .glow-pass-text h3 {
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    .glow-pass-text p {
      font-size: 0.75rem;
      opacity: 0.8;
      margin-top: 4px;
    }
    /* Nav */
    .nav-bar {
      position: absolute; bottom: 0; width: 100%; height: 90px; background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px); display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .button-row { display: flex; justify-content: space-around; align-items: center; flex: 1; }
    .nav-icon { width: 24px; height: 24px; color: #fff; opacity: 0.5; }
    .active-nav .nav-icon { color: var(--clr-purple); opacity: 1; }
    .home-indicator { width: 134px; height: 5px; background: #fff; border-radius: 100px; margin: 8px auto; opacity: 0.3; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="dynamic-island"></div>
  <div class="content">
    <div class="mythic-profile-card">
      <div class="profile-card-inner">
        <div class="profile-main">
          <img id="mainAvatar" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile">
          <div>
            <h1 class="font-black text-lg leading-tight flex items-center">NICK
              <svg class="w-4 h-4 ml-1 text-purple-400" fill="currentColor" viewBox="0 0 20 20"><path d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.64.304 1.24.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"></path></svg>
            </h1>
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">22 • FLORIDA</p>
          </div>
        </div>
        <button class="bg-white/10 p-2 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
      </div>
    </div>
    <div class="section-box">
      <h2 class="section-title">My Bio
        <svg id="editBioIcon" class="w-4 h-4 opacity-50 cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 11l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.464 4.036z"></path></svg>
      </h2>
      <div id="bioText" class="bio-text" contenteditable="true">Write your bio here...</div>
    </div>
    <div class="section-box">
      <h2 class="section-title">Hashtags</h2>
      <div class="tag-input-wrapper">
        <input type="text" id="tagInput" placeholder="Add hashtag..." maxlength="15">
        <span class="text-purple-400 font-black cursor-pointer text-lg" id="addTagBtn">+</span>
      </div>
      <div id="tagContainer" class="tag-container"></div>
    </div>
    <div class="section-box">
        <h2 class="section-title">Gallery</h2>
        <div class="photo-grid">
            <div class="photo-slot" style="border:none;"><img id="p1" src="https://randomuser.me/api/portraits/women/44.jpg" class="w-full h-full object-cover"></div>
            <div class="photo-slot" id="slot-2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
            <div class="photo-slot" id="slot-3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
        </div>
    </div>
    <button class="save-btn" id="saveAndPreview">Save & Preview Card</button>

    <!-- SEEN GLOW PASS added back here -->
    <div class="glow-pass-card">
      <div class="glow-pass-text">
        <h3>SEEN GLOW PASS</h3>
        <p class="text-xs opacity-80">Priority placement & 2x more matches</p>
      </div>
      <div class="bg-white text-black px-4 py-2 rounded-full font-black text-xs tracking-tighter">
        UPGRADE
      </div>
    </div>
  </div>

  <div id="previewModal">
    <div id="card-container" class="w-full max-w-[380px] h-[600px] relative">
      <article id="main-card" class="rounded-3xl overflow-hidden shadow-2xl relative w-full h-full">
        <div class="absolute inset-0 animate-mythic p-[2px] bg-[conic-gradient(from_0deg,#7c3aed,#ec4899,#06b6d4,#7c3aed)]">
          <div class="w-full h-full bg-black rounded-3xl"></div>
        </div>
       
        <div class="absolute inset-[2px] bg-gradient-to-b from-gray-950 to-black rounded-3xl flex flex-col overflow-hidden">
          <div class="relative h-[60%]">
            <img id="previewImg" src="" class="w-full h-full object-cover" alt="profile" />
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
          </div>
         
          <div class="flex-1 p-5 flex flex-col z-10">
            <div class="flex justify-between items-center mb-3">
              <h2 class="text-2xl font-black">NICK, 22</h2>
              <div class="bg-purple-700 px-3 py-1 rounded-lg font-black text-xs">NEW</div>
            </div>
            <div class="flex-1 bg-white/5 rounded-2xl p-4 border border-white/10">
              <div id="previewBio" class="text-sm text-gray-300 italic"></div>
              <div id="previewHashtags" class="mt-3 flex flex-wrap gap-2"></div>
            </div>
            <button id="closePreview" class="mt-4 text-xs font-black uppercase tracking-widest text-purple-400 underline">Back to Editor</button>
          </div>
        </div>
      </article>
    </div>
  </div>

  <nav class="nav-bar">
    <div class="button-row">
      <button onclick="window.location.href='discover.html'"><svg class="nav-icon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204zm217.9-325.7V868H632V640c0-22.1-17.9-40-40-40H432c-22.1 0-40 17.9-40 40v228H238.1V542.3h-96l370-369.7 23.1 23.1L882 542.3h-96.1z"></path></svg></button>
      <button onclick="window.location.href='Explore.html'"><svg class="nav-icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
      <button class="active-nav"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0Z"></path></svg></button>
      <button onclick="window.location.href='store.html'"><svg class="nav-icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle></svg></button>
    </div>
    <div class="home-indicator"></div>
  </nav>
</div>
<input type="file" id="photo-upload" hidden accept="image/*">
<script>
  // --- Photo Logic ---
  const uploadInput = document.getElementById('photo-upload');
  let currentSlot = null;
  const bindSlot = (id) => {
    const slot = document.getElementById(id);
    slot.addEventListener('click', () => { currentSlot = slot; uploadInput.click(); });
  };
  bindSlot('slot-2'); bindSlot('slot-3');
  uploadInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      const url = URL.createObjectURL(e.target.files[0]);
      currentSlot.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
      currentSlot.style.border = 'none';
      if(currentSlot.id === 'p1') document.getElementById('previewImg').src = url;
    }
  });
  // --- Hashtag Logic ---
  const tagInput = document.getElementById('tagInput');
  const addTagBtn = document.getElementById('addTagBtn');
  const tagContainer = document.getElementById('tagContainer');
  function addTag() {
    let val = tagInput.value.trim();
    if (val !== "") {
      if (!val.startsWith('#')) val = '#' + val;
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.innerHTML = `${val} <span class="opacity-40 cursor-pointer" onclick="this.parentElement.remove()">×</span>`;
      tagContainer.appendChild(tag);
      tagInput.value = "";
    }
  }
  addTagBtn.addEventListener('click', addTag);
  // --- SAVE & PREVIEW LOGIC ---
  const previewModal = document.getElementById('previewModal');
  const saveBtn = document.getElementById('saveAndPreview');
  const closePreview = document.getElementById('closePreview');
  saveBtn.onclick = () => {
    // 1. Get data from editor
    const currentBio = document.getElementById('bioText').innerText;
    const tags = Array.from(tagContainer.querySelectorAll('.tag')).map(t => t.innerText.replace('×', '').trim());
    const profileImg = document.querySelector('#p1 img')?.src || document.getElementById('p1').src;
    // 2. Inject into Discovery Card UI
    document.getElementById('previewBio').innerText = currentBio;
    document.getElementById('previewImg').src = profileImg;
   
    const hashContainer = document.getElementById('previewHashtags');
    hashContainer.innerHTML = "";
    tags.forEach(t => {
        const span = document.createElement('span');
        span.className = "text-[10px] bg-purple-500/20 text-purple-300 px-2 py-1 rounded-md font-bold";
        span.innerText = t;
        hashContainer.appendChild(span);
    });
    // 3. Show Modal
    previewModal.style.display = 'grid';
  };
  closePreview.onclick = () => {
    previewModal.style.display = 'none';
  };
</script>
</body>
</html>
