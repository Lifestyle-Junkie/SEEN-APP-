<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>SEEN Profile - iPhone 17 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #000;
      --mythic-gradient: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4, #7c3aed);
      --clr-purple: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      margin: 0 auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* iPhone 17 Pro Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 3000;
    }

    .content {
      flex: 1;
      padding: 1.5rem;
      padding-top: 70px;
      overflow-y: auto;
      padding-bottom: 110px;
    }
    .content::-webkit-scrollbar { display: none; }

    /* Profile Header Mythic Card */
    .mythic-profile-card {
      position: relative;
      padding: 1.5px;
      border-radius: 28px;
      background: var(--mythic-gradient);
      background-size: 200% 200%;
      animation: gradientMove 4s ease infinite;
      margin-bottom: 2rem;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .profile-card-inner {
      background: #0a0a0a;
      border-radius: 27px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .profile-main img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #000;
      object-fit: cover;
    }

    .verified-badge {
        color: #a78bfa;
        font-size: 14px;
        margin-left: 4px;
    }

    /* Section Styling */
    .section-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a78bfa;
      margin-bottom: 0.75rem;
    }

    /* Photo Slots */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .photo-slot {
      aspect-ratio: 1/1;
      background: #111;
      border-radius: 15px;
      border: 1.5px dashed #333;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .photo-slot:hover {
        border-color: #a78bfa;
    }

    /* Glow Pass Special Item */
    .glow-pass-card {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(236, 72, 153, 0.2));
      border: 1px solid #7c3aed;
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.3);
      border-radius: 22px;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .glow-pass-text h3 {
        font-weight: 900;
        font-size: 1rem;
        letter-spacing: 1px;
    }

    /* Navigation */
    .nav-bar {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .button-row { display: flex; justify-content: space-around; align-items: center; flex: 1; }
    .home-indicator { width: 134px; height: 5px; background: #fff; border-radius: 100px; margin: 8px auto; opacity: 0.3; }
    .button .icon { width: 24px; height: 24px; color: #fff; }
    .active-nav { color: #a78bfa !important; }

  </style>
</head>
<body>

<div class="app-container">
  <div class="dynamic-island"></div>

  <div class="content">
    
    <div class="mythic-profile-card">
      <div class="profile-card-inner">
        <div class="profile-main">
          <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile">
          <div>
            <h1 class="font-black text-lg leading-tight">NICK <span class="verified-badge"></span></h1>
            <p class="text-xs text-gray-400 font-semibold uppercase tracking-wider">22 • FLORIDA • </p>
          </div>
        </div>
        <div class="text-xl"></div>
      </div>
    </div>

    <div class="section-box">
      <h2 class="section-title">Bio</h2>
      <p class="text-sm text-gray-200 leading-relaxed">
        Dating advice that harnesses the power of vulnerability . Always down for a coffee run or a deep talk about the universe.
      </p>
    </div>

    <div class="section-box">
        <h2 class="section-title">Gallery</h2>
        <div class="photo-grid">
            <div class="photo-slot" style="border:none;">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" class="w-full h-full object-cover">
            </div>
            <div class="photo-slot" id="slot-2">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="photo-slot">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
        </div>
    </div>

    <div class="glow-pass-card">
        <div class="glow-pass-text">
            <h3>SEEN GLOW PASS</h3>
            <p class="text-xs opacity-80">Priority placement & 2x more matches</p>
        </div>
        <div class="bg-white text-black px-4 py-2 rounded-full font-black text-xs tracking-tighter">
            UPGRADE
        </div>
    </div>

  </div>

  <nav class="nav-bar">
    <div class="button-row">
      <!-- Home → discover.html -->
      <button class="button" onclick="window.location.href='discover.html'">
        <svg class="icon" viewBox="0 0 1024 1024" fill="currentColor">
          <path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204zm217.9-325.7V868H632V640c0-22.1-17.9-40-40-40H432c-22.1 0-40 17.9-40 40v228H238.1V542.3h-96l370-369.7 23.1 23.1L882 542.3h-96.1z"></path>
        </svg>
      </button>

      <!-- Search → Explore.html -->
      <button class="button" onclick="window.location.href='Explore.html'">
        <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </button>

      <!-- Profile (active on this page) -->
      <button class="button active-nav">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0Z"></path>
        </svg>
      </button>

      <!-- Store → store.html -->
      <button class="button" onclick="window.location.href='store.html'">
        <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
        </svg>
      </button>
    </div>
    <div class="home-indicator"></div>
  </nav>
</div>

<input type="file" id="photo-upload" hidden accept="image/*">

<script>
  // Simple photo upload simulation
  const slot2 = document.getElementById('slot-2');
  const uploadInput = document.getElementById('photo-upload');

  slot2.addEventListener('click', () => uploadInput.click());

  uploadInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      const url = URL.createObjectURL(e.target.files[0]);
      slot2.innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
      slot2.style.border = 'none';
    }
  });
</script>

</body>
</html>
