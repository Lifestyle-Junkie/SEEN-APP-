<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap&font-display=swap">
  <style>
    :root {
      --bg: #000;
      --clr-white: #fff;
      --clr-black: #000101;
    }

    @layer reset, base, frame, content, footer, utilities;

    @layer reset {
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    }

    @layer base {
      * {
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: var(--bg);
        min-height: 100dvh;
        margin: 0;
      }
    }

    @layer frame {
      .frame {
        width: 100vw;
        min-height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
    }

    @layer content {
      .content {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-bottom: 64px;
        overflow-y: auto;
      }

      .card {
        width: clamp(200px, 95vw, 400px);
        display: flex;
        flex-direction: column;
        border-radius: clamp(20px, 6vw, 36px);
        background-color: rgba(0, 0, 0, 1);
        padding: clamp(18px, 6vw, 36px);
        box-shadow: 0px 0px clamp(20px, 6vw, 36px) rgba(0, 0, 0, 0.3);
      }

      .lists {
        margin-top: 0;
        display: flex;
        flex-direction: column;
        grid-row-gap: clamp(8px, 2.5vw, 18px);
        row-gap: clamp(8px, 2.5vw, 18px);
        font-size: clamp(12px, 4vw, 22px);
        line-height: clamp(18px, 5vw, 28px);
        color: rgba(255, 255, 255, 1);
      }

      .list {
        display: flex;
        align-items: center;
      }

      .list svg {
        height: clamp(12px, 4vw, 22px);
        width: clamp(12px, 4vw, 22px);
      }

      .list span {
        margin-left: clamp(12px, 4vw, 22px);
        font-size: clamp(12px, 4vw, 22px);
      }

      .button-container {
        display: flex;
        justify-content: space-between;
        gap: clamp(6px, 2vw, 14px);
        margin-top: 0;
      }

      .card button {
        font-size: clamp(10px, 3vw, 16px);
        color: #fafafa;
        text-transform: uppercase;
        padding: clamp(6px, 2vw, 14px) clamp(12px, 4vw, 28px);
        border-radius: clamp(8px, 2.5vw, 16px);
        border: 2px solid #fafafa;
        background: #000000;
        box-shadow: 3px 3px #fafafa;
        cursor: pointer;
        margin: clamp(6px, 2vw, 14px) 0;
        box-sizing: border-box;
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        min-height: clamp(40px, 12vw, 64px);
        min-width: 0;
      }

      .card button .btn-title {
        font-size: clamp(10px, 3vw, 16px);
        letter-spacing: 0.02em;
      }

      .card button .btn-price {
        font-size: clamp(14px, 4vw, 22px);
        font-weight: 700;
        margin-top: 0;
        opacity: 1;
        text-transform: none;
        line-height: 1;
      }

      .card button:active {
        box-shadow: none;
        transform: translate(3px, 3px);
      }

      .image-container {
        position: relative;
        width: clamp(200px, 95vw, 400px);
        height: clamp(120px, 57vw, 240px);
        margin: clamp(40px, 15vh, 80px) 0 0 0;
      }

      .image-container img {
        width: 100%;
        height: 100%;
        border-radius: clamp(24px, 8vw, 48px);
        object-fit: cover;
      }

      .image-text {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #fff;
        text-shadow: 0px 0px clamp(4px, 1.5vw, 8px) rgba(0, 0, 0, 0.5);
      }

      .image-text .seen {
        font-size: clamp(32px, 9vw, 56px);
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: clamp(6px, 2vw, 14px);
      }

      .image-text .subtitle {
        font-size: clamp(10px, 3vw, 18px);
        font-weight: 400;
        max-width: clamp(180px, 85vw, 360px);
        line-height: 1.2;
      }

      .button {
        cursor: pointer;
        position: relative;
        padding: clamp(8px, 2.5vw, 16px) clamp(18px, 5vw, 36px);
        font-size: clamp(14px, 4.5vw, 26px);
        color: rgb(193, 163, 98);
        border: 2px solid rgb(193, 163, 98);
        border-radius: clamp(28px, 8vw, 48px);
        background-color: transparent;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
        overflow: hidden;
      }

      .button::before {
        content: '';
        position: absolute;
        inset: 0;
        margin: auto;
        width: clamp(36px, 10vw, 64px);
        height: clamp(36px, 10vw, 64px);
        border-radius: inherit;
        scale: 0;
        z-index: -1;
        background-color: rgb(193, 163, 98);
        transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
      }

      .button:hover::before {
        scale: 3;
      }

      .button:hover {
        color: #212121;
        scale: 1.1;
        box-shadow: 0 0px clamp(16px, 5vw, 28px) rgba(193, 163, 98, 0.4);
      }

      .button:active {
        scale: 1;
      }

      .subscribe-cta .button {
        color: #000000;
        border-color: #ffffff;
        background-color: #ffffff;
        width: 100%;
      }

      .subscribe-cta .button::before {
        background-color: #ffffff;
      }

      .subscribe-cta .button:hover {
        color: #212121;
        box-shadow: 0 0px clamp(16px, 5vw, 28px) rgba(255, 255, 255, 0.4);
        outline: none;
      }
    }

    @layer footer {
      .nav-bar {
        position: fixed;
        bottom: 0;
        left: -0px;
        width: 100%;
        height: 64px;
        background: var(--bg);
        display: flex;
        justify-content: space-around;
        align-items: center;
        border-top: 1px solid #333;
        border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px;
        z-index: 10;
      }

      .nav-bar .button-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        justify-items: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 0 8px;
      }

      .nav-bar .button-container .nav-button {
        background: none;
        border: none;
        color: var(--clr-white);
        font-size: 24px;
        cursor: pointer;
        transition: color 0.2s;
        width: 100%;
        max-width: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        transform: none !important;
        will-change: none;
        touch-action: manipulation;
        user-select: none;
        outline: none;
      }

      .nav-bar .button-container .nav-button:hover {
        color: #ccc;
        transform: none !important;
      }

      .nav-bar .button-container .nav-button:active {
        transform: none !important;
      }

      .nav-bar .button-container .nav-button .icon {
        width: 1em;
        height: 1em;
        vertical-align: middle;
      }
    }

    @layer utilities {
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    /* Media query for fine-tuning on small screens */
    @media screen and (max-width: 360px) {
      .card {
        width: clamp(180px, 90vw, 280px);
      }

      .image-container {
        width: clamp(180px, 90vw, 280px);
        height: clamp(110px, 54vw, 168px);
      }

      .subscribe-cta {
        width: clamp(180px, 90vw, 280px);
      }
    }

    /* Media query for fine-tuning on large screens */
    @media screen and (min-width: 1200px) {
      .card {
        width: clamp(320px, 85vw, 480px);
      }

      .image-container {
        width: clamp(320px, 85vw, 480px);
        height: clamp(192px, 25vh, 288px);
      }

      .subscribe-cta {
        width: clamp(320px, 85vw, 480px);
      }
    }
  </style>
</head>
