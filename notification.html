<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Notifications • SEEN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap">
  <style>
    :root {
      --bg: #000;
      --clr-white: #fff;
      --clr-red: #ff5168;
      --clr-green: #63ff68;
      --mythic: linear-gradient(135deg, #7c3aed, #ec4899, #06b6d4);
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: white;
      font-family: 'Poppins', sans-serif;
      height: 100dvh;
      overflow: hidden;
    }
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 2000;
      padding-top: env(safe-area-inset-top);
    }
    .logo-text {
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: 6px;
      background: linear-gradient(to right, #fff, #a78bfa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-icon-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .content {
      padding: 110px 16px 90px;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { display: none; }
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #a78bfa;
      margin: 1.8rem 0 1rem;
      text-transform: uppercase;
    }
    .notif-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
    }
    .notif-card:hover {
      background: rgba(255,255,255,0.1);
    }
    .notif-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(167,139,250,0.4);
      flex-shrink: 0;
    }
    .notif-content {
      flex: 1;
      min-width: 0;
    }
    .notif-name {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 3px;
    }
    .notif-text {
      font-size: 0.9rem;
      color: #ccc;
    }
    .notif-time {
      font-size: 0.75rem;
      color: #777;
      margin-top: 4px;
    }
    .action-pill {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .liked { background: var(--clr-green); color: black; }
    .noped  { background: var(--clr-red);   color: white; }
    .request { background: #a78bfa; color: white; }
    /* ────────────────────────────────────────────── */
    /* Exact nav bar styles copied from discover.html  */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: var(--bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #333;
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .button-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;
      justify-items: center;
    }
    .button .icon { 
      width: 26px; 
      height: 26px; 
      color: white; 
    }
  </style>
</head>
<body>

<header class="app-header">
  <button class="top-icon-btn" onclick="history.back()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
  </button>
  <span class="logo-text">SEEN</span>
  <button class="top-icon-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
  </button>
</header>

<div class="content">

  <div class="section-title">Recent Activity</div>

  <div class="notif-card">
    <img src="https://i.pravatar.cc/150?u=ava" class="notif-avatar" alt="">
    <div class="notif-content">
      <div class="notif-name">Ava</div>
      <div class="notif-text"><span class="text-green-400 font-bold">Liked</span> your profile</div>
      <div class="notif-time">12m ago</div>
    </div>
    <div class="action-pill liked">LIKED</div>
  </div>

  <div class="notif-card">
    <img src="https://i.pravatar.cc/150?u=noah" class="notif-avatar" alt="">
    <div class="notif-content">
      <div class="notif-name">Noah</div>
      <div class="notif-text"><span class="text-red-400 font-bold">Noped</span> your profile</div>
      <div class="notif-time">47m ago</div>
    </div>
    <div class="action-pill noped">NOPED</div>
  </div>

  <div class="section-title">New Requests</div>

  <div class="notif-card">
    <img src="https://i.pravatar.cc/150?u=leo" class="notif-avatar" alt="">
    <div class="notif-content">
      <div class="notif-name">Leo</div>
      <div class="notif-text">wants to chat • “Hey, saw you're into journalism too!”</div>
      <div class="notif-time">2h ago</div>
    </div>
    <div class="action-pill request">Request</div>
  </div>

  <!-- Add more notifications here as needed -->

</div>

<nav class="nav-bar">
  <div class="button-container">
    <button class="button"><svg class="icon" viewBox="0 0 1024 1024" fill="currentColor"><path d="M946.5 505L560.1 118.8l-25.9-25.9a31.5 31.5 0 0 0-44.4 0L77.5 505a63.9 63.9 0 0 0-18.8 46c.4 35.2 29.7 63.3 64.9 63.3h42.5V940h691.8V614.3h43.4c17.1 0 33.2-6.7 45.3-18.8a63.6 63.6 0 0 0 18.7-45.3c0-17-6.7-33.1-18.8-45.2zM568 868H456V664h112v204zm217.9-325.7V868H632V640c0-22.1-17.9-40-40-40H432c-22.1 0-40 17.9-40 40v228H238.1V542.3h-96l370-369.7 23.1 23.1L882 542.3h-96.1z"></path></svg></button>
   
    <button class="button" onclick="window.location.href='Explore.html'">
      <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </button>
   
    <button class="button" onclick="window.location.href='profile.html'">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5a5.5 5.5 0 0 1 3.096 10.047 9.005 9.005 0 0 1 5.9 8.181.75.75 0 1 1-1.499.044 7.5 7.5 0 0 0-14.993 0 .75.75 0 0 1-1.5-.045 9.005 9.005 0 0 1 5.9-8.18A5.5 5.5 0 0 1 12 2.5ZM8 8a4 4 0 1 0 8 0 4 4 0 1 0-8 0Z"></path></svg>
    </button>
   
    <button class="button" onclick="window.location.href='store.html'">
      <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle></svg>
    </button>
  </div>
</nav>

</body>
</html>
